# cairn.toml — the schema for this project's roadmap and issues.
#
# Everything here is configurable: the item types, the statuses they move
# through, any extra fields you want to track, the milestones, the saved views,
# and how ROADMAP.md gets rendered. Delete what you do not need.
#
#   cairn config          show the resolved schema
#   cairn check           validate every item against it
#   man cairn             full reference

# On-disk format version. cairn refuses to open a project written in a format it
# does not know, rather than misreading it. See "Compatibility" in the manual.
format = 3

[project]
name = "harrow"
dir = "cairn/items"           # where item files live, relative to this file
id_width = 4              # 0001, 0002, ...
default_type = "feature"
default_status = "backlog"
# filename_max = 255      # longest filename your filesystem accepts, in bytes;
                          # titles are only shortened as much as this demands
# url = "https://github.com/OWNER/REPO/blob/main"   # makes rendered items clickable

# ─── Item types ──────────────────────────────────────────────────────────────
# `template` seeds the body of new items of that type, so every bug report and
# every feature arrives with the same headings.

[[type]]
name = "feature"
icon = "+"
color = "cyan"
template = """
## Problem

## Proposal

## Acceptance criteria

- [ ]
"""

[[type]]
name = "bug"
icon = "!"
color = "red"
template = """
## What happens

## What should happen

## Reproduction

1.
"""

[[type]]
name = "chore"
icon = "~"
color = "gray"
template = """
## Why now

## What changes

## Done when

- [ ]
"""

# Not work, and deliberately not a feature: the answer to a question that
# would otherwise be reargued every few months. It records what was decided,
# what it cost, and what evidence would reopen it.
[[type]]
name = "decision"
icon = "="
color = "magenta"
template = """
## Context

## Options and tradeoffs

## Decision

## Revisit when
"""

[[type]]
name = "spike"
icon = "?"
color = "magenta"
template = """
## Question

## Why it has to be answered before the work

## Options

## What would settle it

## Answer

<!-- Filled in when the spike closes. A spike that closes with no answer
     recorded was a waste of the time it took. -->
"""

[[type]]
name = "docs"
icon = "*"
color = "blue"
template = """
## What a reader needs

## Where it goes

## Done when

- [ ]
"""

# ─── Statuses ────────────────────────────────────────────────────────────────
# Order matters: it is the column order on the board and the sort order in
# listings. `category` is what the tool reasons about — open / active / done /
# dropped — so you can rename the statuses themselves to anything you like.

[[status]]
name = "backlog"
category = "open"
color = "gray"

[[status]]
name = "planned"
category = "open"
color = "blue"

[[status]]
name = "doing"
label = "in progress"
category = "active"
color = "yellow"

[[status]]
name = "blocked"
category = "active"
color = "red"

[[status]]
name = "done"
category = "done"
color = "green"

[[status]]
name = "dropped"
category = "dropped"
color = "gray"
board = false             # hide this column on `cairn board`

# ─── Custom fields ───────────────────────────────────────────────────────────
# kind = text | enum | list | date | number | bool
# `column = true` puts the field in the default `cairn list` table.
# Composition. `part_of` is a reference: its values name other items rather than
# describing this one. Many-valued on purpose — an item can belong to two larger
# efforts at once, which a `parent` field could not express and which is why
# there is no such field.
#
# Nothing requires it. `cairn new` still takes only a title, and structure is
# added afterwards: `cairn set 12 part_of=7`.
[[type]]
name = "milestone"
description = "Work a cairn backlog from the terminal — read it, triage it, and change it without typing an id."
groups = "one"
inverse = "scheduled"

[[field]]
name = "due"
kind = "date"
description = "when a milestone is meant to land"

[[field]]
name = "part_of"
kind = "ref"
target = "*"
cardinality = "many"
acyclic = true
rollup = true
inverse = "contains"
description = "a larger piece of work this belongs to"

# Enum values are ordered: `cairn list --sort priority` respects that order.

[[field]]
name = "priority"
kind = "enum"
values = ["p0", "p1", "p2", "p3"]
default = "p2"
column = true
description = "p0 is a release blocker"

[[field]]
name = "effort"
kind = "enum"
values = ["s", "m", "l", "xl"]
description = "Rough size, not an estimate"

[[field]]
name = "area"
kind = "enum"
values = [
  "read",       # cairn.toml, item files, the derived set
  "filter",     # the grammar, sorting, saved views
  "chrome",     # the list, the board, the detail pane, overlays
  "write",      # everything that hands a change to cairn
  "theme",      # colour roles, theme files, terminal inheritance
  "config",     # config.toml and keybindings
  "cli",        # flags, --plain, --doctor, --screenshot
  "runtime",    # the loader thread, signals, terminal lifecycle
  "testing",
  "docs",
  "packaging",
]
column = true
description = "Subsystem this touches"

[[view]]
name = "now"
description = "Claimed and under way"
filter = "category=active"
sort = "priority,id"

# The approved queue. Anything here has been looked at and agreed as the next
# thing worth doing; everything else is a backlog entry, however good. Keeping
# it short is the point — a queue of twenty is a backlog with a nicer name.
[[view]]
name = "next"
description = "Approved to start, in order"
filter = "status=planned"
sort = "priority,id"

[[view]]
name = "waiting"
description = "Open, and stopped on something outside this repository"
filter = "status=blocked"
sort = "priority,id"

# Open work nobody has sized. Effort has no default, so this fires on exactly
# the items that have never been weighed.
[[view]]
name = "triage"
description = "Open work nobody has weighed yet"
filter = "category!=done,category!=dropped,effort="
columns = ["id", "type", "title", "created"]
sort = "id"

# A decision is worth most after it is settled, so this has to name a category
# explicitly: a filter that mentions neither status nor category shows open
# work only, and a closed decision would vanish from the one view that exists
# to keep it findable.
[[view]]
name = "decisions"
description = "What was settled, and what would reopen it"
filter = "type=decision,category!=dropped"
sort = "-updated"

# Most of this project's finished work predates closing through cairn and has
# no completion date. Requiring one here would show a single item and imply
# the rest never happened; inventing one would be worse. So this orders by
# last change, which every item has, and shows the completion date in a
# column — blank wherever the record does not hold one. 0100 records why.
[[view]]
name = "history"
description = "Finished work, most recently closed first"
filter = "status=done"
sort = "-updated"
columns = ["id", "type", "title", "closed_at"]

# ─── Hooks ───────────────────────────────────────────────────────────────────
# cairn does not embed a scripting language; it runs yours. A hook takes one of
# two forms:
#
#   a string  runs through the platform shell — convenient, and therefore
#             platform-specific ($VAR on Unix is %VAR% under cmd.exe)
#   an array  is executed directly with no shell at all — portable
#
# Each runs from the project root with the event in the environment and the
# full item as JSON on stdin:
#
#   CAIRN_EVENT CAIRN_ROOT CAIRN_CONFIG
#   CAIRN_ITEM_ID CAIRN_ITEM_PATH CAIRN_ITEM_TITLE
#   CAIRN_ITEM_STATUS CAIRN_ITEM_TYPE CAIRN_ITEM_MILESTONE CAIRN_ITEM_CATEGORY
#
# Hooks run after the change is on disk, so a failing hook warns but never rolls
# anything back. Suppress them with --no-hooks or CAIRN_NO_HOOKS=1.

# Keeping the rendered roadmap current is the tool's whole point, so it is done
# for you. Comment these out if you would rather render by hand — but a roadmap
# that drifts from the items is the rot cairn exists to prevent, and leaving it
# to discipline is how it starts.

[hooks]
after-create = "cairn render -q"
after-change = "cairn render -q"
after-remove = "cairn render -q"
# after-render = "git add ROADMAP.md"
# after-change = ["python3", "scripts/notify.py"]   # portable form

# ─── Rendered roadmap ────────────────────────────────────────────────────────

[render]
target = "ROADMAP.md"
title = "Roadmap"
group_by = "milestone"    # any field works: milestone, area, assignee, type
include = "category!=dropped"
checkbox = true           # render items as a task list
show_ids = true
progress = true           # per-milestone progress bar
group_by_status = true    # sub-group each section by status
link_items = false        # requires project.url
# header = "docs/roadmap-intro.md"   # spliced in above the generated body
# footer = "docs/roadmap-outro.md"
