[package]
name = "harrow"
version = "0.1.0"
description = "Work a cairn backlog from the terminal"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/oddurs/harrow"
homepage = "https://github.com/oddurs/harrow"
readme = "README.md"
keywords = ["cairn", "tui", "backlog", "roadmap", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/.githooks", "/scripts", "/tests/snapshots"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.189"
# The one dependency here that is not a leaf. It is the standard filesystem
# watcher: FSEvents on macOS, inotify on Linux, ReadDirectoryChangesW on
# Windows. The alternative is hand-rolling two of those behind
# `#![deny(unsafe_code)]`, for a feature whose failure mode is silently
# stopping, on platforms this is not developed on.
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
# Only to read cairn's conformance corpus, which records its expectations as
# JSON. Hand-rolling a second parser in order to check the first one would be
# testing my reading of two formats against itself.
serde_json = "1.0.145"
